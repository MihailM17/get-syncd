# Get Syncd — per-OS test + desktop builds.
# PyInstaller and Tauri cannot cross-compile, so each OS builds natively here.
name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  python-tests:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -e ".[dev]"
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/pytest tests -q
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\pytest tests -q

  desktop:
    needs: python-tests
    # Release uploads need write access; without this, tag builds fail while
    # plain build-only runs succeed.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install frontend deps
        run: npm ci
      # System deps for Tauri on Linux
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv ../.venv
          ../.venv/bin/pip install -e .. pyinstaller
          ../scripts/build-sidecar.sh
      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv ..\.venv
          ..\.venv\Scripts\pip install -e .. pyinstaller
          ..\.venv\Scripts\pyinstaller --onefile --name get-syncd-api-${{ matrix.target }} --distpath src-tauri/binaries --workpath $env:TEMP\pyinstaller_build --specpath $env:TEMP --clean --paths ..\src --collect-all opentimelineio --collect-data opentimelineio --hidden-import=opentimelineio --hidden-import=opentimelineio.adapters.builtin_adapters --copy-metadata opentimelineio --copy-metadata get-syncd --hidden-import=PIL --hidden-import=rich ..\scripts\sidecar_entry.py
      # Version tags (v*) build AND publish: the .dmg/.exe/.msi/.AppImage get
      # attached to a GitHub Release — Releases are the main download.
      # Plain pushes/PRs only validate the build (no release).
      # projectPath: the Tauri project lives in app/, not the repo root.
      - uses: tauri-apps/tauri-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Get Syncd ${{ github.ref_name }}
          releaseDraft: false
      - uses: tauri-apps/tauri-action@v1
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
