[project]
name = "get-syncd"
version = "0.1.0"
description = "Git-based version control for DaVinci Resolve — save checkpoints, see diffs, restore safely"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Get Syncd Contributors" }]
dependencies = [
    "opentimelineio>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
get-syncd = "get_syncd.cli:main"
reeltrace = "get_syncd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/get_syncd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
